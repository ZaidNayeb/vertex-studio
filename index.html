<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header of the page -->
    <header>
      <a href="#" class="logo">
        <h1>Vertex.</h1>
      </a>
      <nav>
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./projects.html">Projects</a></li>
          <li><a href="./members.html">Members</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </nav>
      <a href="#" class="btn">
        Contact
        <span>↗</span>
      </a>
    </header>

    <!-- Hero Section -->
    <main>
      <section class="hero">
        <div class="hero-content">
          <p>We're Vertex Studio</p>
          <h1>Building the web, Beautifully</h1>
          <h4>
            A group of passionate developers crafting <br />
            fast, modern and user-friendly websites
          </h4>
          <button>
            <a href="#">
              View Our Work
              <span>↗</span>
            </a>
          </button>
        </div>

        <div class="hero-illustration">
          <img src="./images/Main-Page/main-page_dark-mode.png" alt="" />
        </div>
      </section>
    </main>

    <!-- Footer( Companies ) -->
    <footer>
      <div class="companies">
        <!-- <h4>Trusted by students, startups, and creative minds.</h4> -->

        <a href="#">
          <img
            src="./images/Main-Page/GitHub Logo - White - zonalogo.com.png "
            alt="logo of Github"
          />
        </a>
        <a href="#">
          <img
            src="./images/Main-Page/Vercel Logo - Light - zonalogo.com.svg"
            alt="logo of Vercel"
          />
        </a>
        <a href="#">
          <img
            src="./images/Main-Page/Tailwind CSS Logo - White - zonalogo.com.svg "
            alt="logo of Tailwind CSS"
          />
        </a>
        <a href="#">
          <img
            src="./images/Main-Page/React Logo - Light - zonalogo.com.svg"
            alt="logo of react"
          />
        </a>
        <a href="#">
          <img
            src="./images/Main-Page/MongoDB Logo - White - zonalogo.com.svg"
            alt="logo of react"
          />
        </a>
